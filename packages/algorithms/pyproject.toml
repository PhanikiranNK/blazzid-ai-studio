[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blazzid-algorithms"
version = "0.1.0"
description = "Pure mathematical algorithms and optimization routines for BLAZZID AI Studio"
requires-python = ">=3.9"
dependencies = [
    "blazzid-core",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
