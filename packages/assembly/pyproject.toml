[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blazzid-assembly"
version = "0.1.0"
description = "Highlight ranking, duration-budgeted selection, and montage assembly for BLAZZID AI Studio"
requires-python = ">=3.9"
dependencies = [
    "blazzid-core",
    "blazzid-algorithms",
    "blazzid-media",
    "blazzid-detection",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blazzid_assembly = ["assets/*/*"]

