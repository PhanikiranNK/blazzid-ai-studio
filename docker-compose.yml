services:
  postgres:
    image: postgres:16-alpine
    container_name: blazzid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blazzid_db
      POSTGRES_USER: blazzid_user
      POSTGRES_PASSWORD: blazzid_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blazzid_user -d blazzid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blazzid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: blazzid-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://blazzid_user:blazzid_password@postgres:5432/blazzid_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/storage
      BLAZZID_ENV: development
      BLAZZID_ALLOW_ANONYMOUS_DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: blazzid-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://blazzid_user:blazzid_password@postgres:5432/blazzid_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/storage
    volumes:
      - storage_data:/data/storage

volumes:
  postgres_data:
  storage_data:
